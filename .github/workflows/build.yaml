name: Build Status

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - LICENSE
      - README.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - name: ubuntu-latest
            dist_path: dist
            os: ubuntu-latest
            python: "3.11"
            target: native
          - name: ubuntu-24.04-arm
            dist_path: dist
            os: ubuntu-24.04-arm
            python: "3.11"
            target: native
          - name: macos-latest
            dist_path: dist
            os: macos-latest
            python: "3.11"
            target: native
          - name: windows-latest
            dist_path: dist
            os: windows-latest
            python: "3.11"
            target: native
          

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions-ext/python/setup@ec67f82b3bd863948308a41ecb9e70547cbb19c7
        with:
          version: ${{ matrix.python }}

      - name: Setup Rust
        uses: actions-ext/rust/setup@0f0b7c9ab3cdb6e9a1f79e2147974d6762ddafea

      - name: Install dependencies
        run: make develop
        if: matrix.target == 'native'

      - name: Lint
        run: make lint
        if: matrix.target == 'native'

      - name: Checks
        run: make checks
        if: matrix.name == 'ubuntu-latest'

      - name: Build
        run: make build
        if: matrix.target == 'native'

      - name: Test
        run: make coverage
        if: matrix.target == 'native'

      - name: Build and test Pyodide wheel
        run: make test-pyodide
        if: matrix.target == 'pyodide'

      - name: Upload test results (Python)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results-${{ matrix.name }}
          path: '**/junit.xml'
        if: always() && matrix.target == 'native'

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        with:
          files: '**/junit.xml'
        if: matrix.name == 'ubuntu-latest'

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: matrix.target == 'native'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /
        shell: bash
        if: matrix.target == 'native' && runner.os == 'Linux'

      - name: Build distributions (Linux x86_64)
        run: |
          rm -rf dist
          make dist-rs
          make dist-py-sdist
          make dist-py-wheel
          make dist-check
        shell: bash
        env:
          CIBW_ARCHS_LINUX: native
        if: matrix.name == 'ubuntu-latest'

      - name: Build distributions (Linux ARM64)
        run: |
          rm -rf dist
          make dist-py-wheel
          make dist-check
        shell: bash
        env:
          CIBW_ARCHS_LINUX: native
        if: matrix.name == 'ubuntu-24.04-arm'

      - name: Build distributions (macOS/Windows)
        run: |
          rm -rf dist
          make dist-py-wheel
          make dist-check
        shell: bash
        env:
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
        if: matrix.target == 'native' && runner.os != 'Linux'

      - name: Test wheel
        uses: actions-ext/python/test-wheel@ec67f82b3bd863948308a41ecb9e70547cbb19c7
        with:
          module: polars_io_tools
        if: matrix.target == 'native' && runner.os == 'Linux'

      - name: Test source distribution
        uses: actions-ext/python/test-sdist@c8228d827a81b9f8c808825328af361c45461ba3
        with:
          module: polars_io_tools
        if: matrix.name == 'ubuntu-latest'

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ matrix.name }}
          path: ${{ matrix.dist_path }}

  test_clickhouse:
    name: test (clickhouse integration)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions-ext/python/setup@ec67f82b3bd863948308a41ecb9e70547cbb19c7
        with:
          version: "3.11"

      # Reuse the Linux wheel built by the `build` job instead of rebuilding the Rust extension.
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-ubuntu-latest
          path: dist

      - name: Install wheel
        run: |
          python -m pip install -U "$(ls dist/*manylinux*.whl)[develop]"
          # Overlay the wheel (including the compiled extension) into the source tree so the
          # checked-out package is importable even though its Rust extension was never built here.
          python -m pip install -U --no-deps "$(ls dist/*manylinux*.whl)" --target .

      # ClickHouse declares a healthcheck, so --wait blocks until the HTTP interface is ready.
      - name: Spin up ClickHouse
        run: make dockerup DOCKERARGS="--wait --wait-timeout 180"

      - name: Run ClickHouse integration tests
        run: python -m pytest polars_io_tools/tests/integration -m clickhouse_required
        env:
          CLICKHOUSE_URL: http://127.0.0.1:8123
          CLICKHOUSE_USER: default

      - name: Spin down ClickHouse
        run: make dockerdown
        if: ${{ always() }}
